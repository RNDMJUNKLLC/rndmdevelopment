<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - RNDM Development</title>
    <meta name="description" content="Contact RNDM Development for your next web project. Submit project inquiries, manage existing projects, and request invoices." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Navigation will be injected here -->
    
    <div id="app">
      <div class="page-section active">
        <div class="container">
          <h1 class="section-title">Contact Us</h1>
          <p class="lead" style="text-align: center; max-width: 800px; margin: 0 auto 3rem;">
            Sign in to submit project inquiries and manage your existing projects.
          </p>
          
          <div id="contact-content" class="contact-content">
            <!-- Content will be dynamically loaded based on auth state -->
            <div style="text-align: center; padding: 3rem;">
              <p>Loading...</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Footer will be injected here -->
    </div>
    
    <script type="module">
      import { initializePage, renderFooter } from '/src/shared.js';
      import { initializeContactPage } from '/src/contact-page.js';
      import '/src/style.css';
      
      // Initialize the contact page
      initializePage('contact');
      initializeContactPage();
      
      // Add footer
      const footer = document.createElement('div');
      footer.innerHTML = renderFooter();
      document.getElementById('app').appendChild(footer.firstElementChild);
    </script>
  </body>
</html>
